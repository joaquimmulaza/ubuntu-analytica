<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/img/favicon-ubuntu.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" href="/img/favicon-ubuntu.png" type="image/x-icon">

    <meta
      name="description"
      content="Creatividade | Excelência | Resultado"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    
    <!-- Google Analytics (gtag.js) - Optimized -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MYF65LHQ52"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Configuração inicial com timestamp
      gtag('js', new Date());
      
      // Configuração do GA4 com opções otimizadas
      gtag('config', 'G-MYF65LHQ52', {
        // Anonimizar IP para conformidade com GDPR/LGPD
        'anonymize_ip': true,
        // Enviar page_view automaticamente
        'send_page_view': true,
        // Cookie flags para segurança
        'cookie_flags': 'SameSite=None;Secure'
      });
    </script>
    
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Ubuntu Analytica</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.

    -->
  </body>
